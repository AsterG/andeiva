name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - run: node scripts/check-repository.mjs
      - name: Scan history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all
      - name: Go static security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 ./cmd/... ./internal/... ./packaging/boot-branding/render/... ./packaging/boot-branding/activation/... ./packaging/boot-branding/offline/check/...
      - name: Analyze the opt-in laboratory diagnostic build
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -tags=andeiva_native_dhcp_diagnostics ./internal/dhcpclient ./internal/previewruntime
      - name: Go vulnerability analysis
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/... ./internal/... ./packaging/boot-branding/render/... ./packaging/boot-branding/activation/... ./packaging/boot-branding/offline/check/...
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Audit all frontend dependencies including build tools
        run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Generate dependency and license inventories
        run: |
          mkdir -p dist
          npm --prefix frontend sbom --sbom-format=cyclonedx > dist/frontend.cdx.json
          node scripts/check-licenses.mjs > dist/frontend-licenses.json
          go list -m -json all > dist/go-modules.json
          go mod verify
          cp LICENSE NOTICE go.mod go.sum packaging/licenses/golang-x-LICENSE.txt packaging/licenses/golang-x-PATENTS.txt dist/
          (cd dist && sha256sum LICENSE NOTICE go.mod go.sum golang-x-LICENSE.txt golang-x-PATENTS.txt go-modules.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-inventory
          path: |
            dist/frontend.cdx.json
            dist/frontend-licenses.json
            dist/go-modules.json
            dist/LICENSE
            dist/NOTICE
            dist/go.mod
            dist/go.sum
            dist/golang-x-LICENSE.txt
            dist/golang-x-PATENTS.txt
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
