name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reserve-compensation-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check out the actual pre-compensation reader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7fe62a0634ed3de00a652dff95aff31f306ec1ff
          path: .tmp/prior-compensation-reader
          persist-credentials: false
      - name: Compile the unchanged prior reader
        working-directory: .tmp/prior-compensation-reader
        run: go test -c -o "${RUNNER_TEMP}/andeiva-prior-compensation-reader.test" ./internal/configpoc
      - name: Verify old-reader refusal before, during and after retirement
        run: |
          go test -race ./internal/configpoc -count=1 -timeout=3m \
            -run '^TestReserveCompensationActualPriorReaderRefusal$' \
            -reclaim-old-reader="${RUNNER_TEMP}/andeiva-prior-compensation-reader.test"

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: bash scripts/check.sh
      # The complete package suite exceeds Go's default ten-minute aggregate
      # budget. This does not alter RPC or persisted transaction deadlines.
      - run: go test -race -timeout=20m ./cmd/... ./internal/...
      - name: DHCP laboratory guard without privileged network operations
        run: |
          bash -n scripts/dhcp-native-isolated.sh
          refusal=0
          CI=1 ANDEIVA_DHCP_LAB_AUTHORIZED=1 bash scripts/dhcp-native-isolated.sh isolated || refusal=$?
          test "$refusal" -eq 64
      - name: Local service policy contracts without runtime activation
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./internal/localpolicy
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./internal/localpolicy
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./internal/localpolicy
          go test ./internal/localpolicy -run '^$' -fuzz FuzzDecode -fuzztime 10s -parallel 2
      - name: Configuration experiment platform source selection
        run: |
          bash scripts/check-config-platforms.sh
          bash -n packaging/preview/tests/storage-pressure.sh
          bash packaging/preview/tests/storage-pressure-log-test.sh
          bash -n packaging/preview/tests/recovery-reserve-pressure.sh
          refusal=0
          bash packaging/preview/tests/recovery-reserve-pressure.sh --invalid || refusal=$?
          test "$refusal" -eq 64
      - name: Inactive boot themes and reproducible data package
        run: bash packaging/boot-branding/tests/run.sh
      - name: Boot activation unprivileged failure and recovery tests
        run: |
          go test -race ./packaging/boot-branding/activation
          go vet ./packaging/boot-branding/activation
          go build -o /tmp/andeiva-boot-activation ./packaging/boot-branding/activation
          bash packaging/boot-branding/activation-package/test.sh
          bash -n packaging/boot-branding/activation-package/native-guard-test.sh
      - name: Offline boot bundle unprivileged contracts
        run: |
          bash packaging/boot-branding/offline/tests/run.sh
          go build -o /tmp/andeiva-boot-offline-check ./packaging/boot-branding/offline/check
      - name: Debian signature verifier positive and negative cases
        run: |
          docker build -f packaging/boot-branding/offline/tests/Dockerfile.dev -t andeiva-offline-verifier packaging/boot-branding/offline/tests
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            --output "${RUNNER_TEMP}/andeiva-public-InRelease" https://deb.debian.org/debian/dists/trixie/InRelease
          sdk=$(go env GOROOT)
          docker run --rm --network none --read-only --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=1073741824,mode=1777 \
            --tmpfs /work:rw,nosuid,nodev,exec,size=536870912,mode=1777 \
            --mount "type=bind,src=${sdk},dst=/opt/go,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/go.mod,dst=/src/go.mod,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/go.sum,dst=/src/go.sum,readonly" \
            --mount "type=bind,src=${GITHUB_WORKSPACE}/packaging/boot-branding/offline,dst=/src/offline,readonly" \
            --mount "type=bind,src=${RUNNER_TEMP}/andeiva-public-InRelease,dst=/fixture/InRelease,readonly" \
            --env PATH=/opt/go/bin:/usr/bin:/bin --env GOENV=off --env GOTOOLCHAIN=local \
            --env GOWORK=off --env GOTELEMETRY=off --env GOPROXY=off --env GOSUMDB=off --env CGO_ENABLED=0 --env GOTMPDIR=/work \
            andeiva-offline-verifier /bin/bash -c '
              set -euo pipefail
              mkdir -p /tmp/source/packaging/boot-branding/offline
              cp /src/go.mod /src/go.sum /tmp/source/
              cp -R /src/offline/. /tmp/source/packaging/boot-branding/offline/
              bash /tmp/source/packaging/boot-branding/offline/tests/signature-native.sh /fixture/InRelease
            '
      - name: Nftables POC unprivileged contracts and platform compilation
        run: bash scripts/check-nft-poc.sh
      - name: Grouped runtime contracts and native fixture guard without privileges
        run: |
          go test -race -count=1 -run 'TestRouted(KernelV3|KernelParentDeathV3|EmptyListenersV3|LaunchV3|HelperV3|CompatibilityV2|APIV3)' ./internal/previewruntime
          go test -race -count=1 -run '^TestTablePresence' ./internal/routedactivation
          bash -n packaging/preview/tests/routed-kernel-native.sh
          if CI=1 bash packaging/preview/tests/routed-kernel-native.sh --isolated-lab /bin/true; then
            echo 'Privileged fixture was incorrectly accepted in CI' >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
          bash -n packaging/preview/tests/routed-launch-native.sh
          if CI=1 bash packaging/preview/tests/routed-launch-native.sh --isolated-lab /bin/true; then
            echo 'Privileged launch fixture was incorrectly accepted in CI' >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - name: Administrative firewall platform compilation without privileges
        run: bash scripts/check-firewall-admin.sh
      - run: bash scripts/smoke-api.sh
      - name: Transactional configuration simulator and resource observations
        run: |
          bash scripts/test-poc-config-paths.sh
          bash scripts/poc-config.sh "${RUNNER_TEMP}/andeiva-config-poc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: configuration-poc-observations
          path: |
            ${{ runner.temp }}/andeiva-config-poc/run-*.json
            ${{ runner.temp }}/andeiva-config-poc/andeiva-config-poc
            ${{ runner.temp }}/andeiva-config-poc/warmup.json
            ${{ runner.temp }}/andeiva-config-poc/SHA256SUMS
            ${{ runner.temp }}/andeiva-config-poc/toolchain.txt
            ${{ runner.temp }}/andeiva-config-poc/source-revision.txt
            ${{ runner.temp }}/andeiva-config-poc/source-state.txt
            ${{ runner.temp }}/andeiva-config-poc/source-files.sha256
          if-no-files-found: error
          retention-days: 7
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  design-system:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned browser test environment
        run: docker build -f frontend/Dockerfile.visual -t andeiva-design-check .
      - name: Check both themes, accessibility, responsive layout and visual baselines
        run: docker run --name andeiva-design-check --network none --cap-drop ALL --security-opt no-new-privileges:true --shm-size=512m andeiva-design-check
      - name: Collect browser observations
        if: always()
        run: |
          mkdir -p frontend/test-results frontend/playwright-report
          if docker container inspect andeiva-design-check >/dev/null 2>&1; then
            if ! docker cp andeiva-design-check:/work/frontend/test-results/. frontend/test-results/; then
              echo "::warning::Browser test results could not be collected"
            fi
            if ! docker cp andeiva-design-check:/work/frontend/playwright-report/. frontend/playwright-report/; then
              echo "::warning::Browser HTML report could not be collected"
            fi
            docker rm -f andeiva-design-check
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: design-system-browser-observations
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

  linux-build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Compile Linux artifacts (not a hardware compatibility test)
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -o dist/andeiva ./cmd/andeiva
          go build -trimpath -buildvcs=false -o dist/andeiva-api ./cmd/andeiva-api
          go build -trimpath -buildvcs=false -o dist/andeiva-config-poc ./cmd/andeiva-config-poc
          go build -trimpath -buildvcs=false -o dist/andeiva-nft-poc ./cmd/andeiva-nft-poc
          go build -trimpath -buildvcs=false -o dist/andeiva-admin-lab ./cmd/andeiva-admin-lab

  debian-package:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Provision verified module cache before offline packaging
        run: |
          go mod download
          go list -mod=readonly -m all > /dev/null
          go mod verify
          GOPROXY=off GOSUMDB=off go list -mod=readonly -m all > /dev/null
          git diff --exit-code -- go.mod go.sum
      - name: Build and inspect experimental Debian package
        run: |
          bash -n packaging/debian/tests/vm-lifecycle.sh
          bash packaging/debian/build.sh '0.0.0~exp1' dist/debian
          bash packaging/debian/build.sh '0.0.0~exp1' .tmp/debian-repro
          cmp dist/debian/andeiva-experimental_0.0.0~exp1_amd64.deb .tmp/debian-repro/andeiva-experimental_0.0.0~exp1_amd64.deb
          bash packaging/debian/tests/static-package.sh --package dist/debian/andeiva-experimental_0.0.0~exp1_amd64.deb --evidence-dir "${RUNNER_TEMP}/andeiva-package-check"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-debian-amd64
          path: |
            dist/debian/*.deb
            dist/debian/SHA256SUMS
            dist/debian/build-info.txt
          if-no-files-found: error
          retention-days: 7

  containers:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target check-go -t andeiva-go-check .
      - run: docker build --target check-web -t andeiva-web-check .
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 60
      - name: Container liveness and CLI smoke
        run: |
          docker compose exec -T andeiva-api /andeiva-api --healthcheck
          docker compose exec -T andeiva-api /andeiva --lang es status
      - if: always()
        run: docker compose down --remove-orphans

  firewall-preview-package:
    needs: source
    if: github.event.repository.private == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Provision verified module cache before offline packaging
        run: |
          go mod download
          go list -mod=readonly -m all > /dev/null
          go mod verify
          GOPROXY=off GOSUMDB=off go list -mod=readonly -m all > /dev/null
          git diff --exit-code -- go.mod go.sum
      - name: Reproducible preview package without privileged execution
        env:
          PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version="0.1.0~alpha${PREVIEW_BUILD_NUMBER}"
          bash packaging/preview/build.sh "$version" dist/preview
          bash packaging/preview/build.sh "$version" .tmp/preview-repro
          cmp "dist/preview/andeiva-firewall-preview_${version}_amd64.deb" ".tmp/preview-repro/andeiva-firewall-preview_${version}_amd64.deb"
          bash packaging/preview/tests/static-package.sh "dist/preview/andeiva-firewall-preview_${version}_amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firewall-alpha-preview-debian13-amd64
          path: |
            dist/preview/*.deb
            dist/preview/SHA256SUMS
            dist/preview/build-info.txt
          if-no-files-found: error
          retention-days: 3

  probe-ca-windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Native custom CA refusal and verified HTTPS tests
        run: go test -count=1 -timeout 60s ./internal/trafficprobe ./cmd/andeiva-traffic-probe
      - run: go vet ./internal/trafficprobe ./cmd/andeiva-traffic-probe

  configuration-v2-endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDEIVA_CONFIG_V2_ENDURANCE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Durable catalogue endurance without engines or privileged operations
        run: go test -race -count=1 ./internal/configpoc -run '^TestV2DurableCatalogue5000Lifecycles$' -v -timeout 30m

  configuration-coordinator-endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Five thousand simulated transaction cycles without privileges
        env:
          ANDEIVA_CONFIG_V2_ENGINE_ENDURANCE: '1'
        run: go test -race ./internal/configpoc -run '^TestCoordinatorV2EngineEndurance5000$' -count=1 -timeout 45m -v
